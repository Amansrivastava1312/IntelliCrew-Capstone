<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliCrew | HR Portal</title>
  <style>
    :root {
      --bg: #f7f6fb;
      --surface: #ffffff;
      --sidebar: #eeeaf7;
      --accent: #8f79c6;
      --accent-hover: #7d66b8;
      --text: #4a4658;
      --muted: #8b869c;
      --line: #e3dff0;
      --error: #a84c5b;
      --success: #34785a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    button, select { font: inherit; }

    .navbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 12px rgba(74, 70, 88, 0.05);
    }

    .brand {
      font-size: 21px;
      font-weight: 750;
    }

    .brand span { color: var(--accent); }

    .logout {
      width: auto;
      margin: 0;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: #fff;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .logout:hover:not(:disabled) {
      color: var(--error);
      border-color: #efd4da;
      background: #fff7f8;
    }

    .logout:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      min-height: calc(100vh - 72px);
    }

    .sidebar {
      padding: 28px 18px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }

    .role-label {
      margin: 0 12px 20px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: var(--accent);
      font-weight: 650;
      text-align: left;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--accent-hover);
    }

    .content { padding: 44px; }

    .welcome-panel {
      padding: 42px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      text-align: center;
    }

    .welcome-panel h1 {
      margin-bottom: 8px;
      color: var(--text);
      font-size: 28px;
    }

    .welcome-panel p,
    .page-sub {
      color: var(--muted);
    }

    .page-title {
      margin-bottom: 7px;
      font-size: 26px;
      font-weight: 750;
    }

    .page-sub { margin-bottom: 26px; }

    .card {
      width: min(100%, 680px);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 8px 26px rgba(74, 70, 88, 0.06);
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 650;
    }

    select {
      width: 100%;
      padding: 12px 42px 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--text);
      background: #fbfaff;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(143, 121, 198, 0.16);
    }

    .primary {
      width: auto;
      margin: 4px 0 0;
      padding: 11px 22px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: var(--accent);
      font-weight: 650;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .primary:hover { background: var(--accent-hover); }

    .message {
      margin-top: 16px;
      color: var(--success);
      font-size: 14px;
    }

    [hidden] { display: none !important; }

    @media (max-width: 760px) {
      .navbar {
        height: 64px;
        padding: 0 18px;
      }

      .brand { font-size: 18px; }

      .layout {
        display: block;
        min-height: calc(100vh - 64px);
      }

      .sidebar {
        padding: 16px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .role-label { margin-bottom: 12px; }
      .content { padding: 28px 18px; }
      .card { padding: 22px; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="brand">Intelli<span>Crew</span></div>
    <button id="logoutButton" class="logout" type="button">
      <span id="logoutButtonText">Logout</span>
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="role-label">HR Portal</div>
      <button id="createRequirementButton" class="nav-item" type="button"
              aria-controls="requirementContent" aria-expanded="false">
        <span aria-hidden="true">＋</span>
        Create Requirement
      </button>
    </aside>

    <main class="content">
      <section id="welcomeContent" class="welcome-panel">
        <h1>Welcome to IntelliCrew</h1>
        <p>Select Create Requirement from the left menu to continue.</p>
      </section>

      <section id="requirementContent" hidden>
        <h1 class="page-title">Create Requirement</h1>
        <p class="page-sub">Select a project and the required skill, then submit the requirement.</p>

        <form id="requirementForm" class="card">
          <div class="form-group">
            <label for="projectSelect">Add Project</label>
            <select id="projectSelect" name="project" required>
              <option value="" selected disabled>Select a project</option>

            </select>
          </div>

          <div class="form-group">
            <label for="skillSelect">Add Skills</label>
            <select id="skillSelect" name="skill" required>
              <option value="" selected disabled>Select a skill</option>

            </select>
          </div>

          <button class="primary" type="submit">Submit</button>
          <p id="formMessage" class="message" role="status" hidden></p>
        </form>
      </section>
    </main>
  </div>

  <script>
    const createRequirementButton = document.getElementById("createRequirementButton");
    const welcomeContent = document.getElementById("welcomeContent");
    const requirementContent = document.getElementById("requirementContent");
    const requirementForm = document.getElementById("requirementForm");
    const formMessage = document.getElementById("formMessage");
    const logoutButton = document.getElementById("logoutButton");
    const logoutButtonText = document.getElementById("logoutButtonText");

    createRequirementButton.addEventListener("click", () => {
      welcomeContent.hidden = true;
      requirementContent.hidden = false;
      createRequirementButton.classList.add("active");
      createRequirementButton.setAttribute("aria-expanded", "true");
    });

    requirementForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const projectSelect = document.getElementById("projectSelect");
      const skillSelect = document.getElementById("skillSelect");
      const project = projectSelect.value;
      const skill = skillSelect.value;

      try {
        const response = await fetch("/api/requirements", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ project, skill })
        });

        if (!response.ok) {
          throw new Error("API not available");
        }

        formMessage.textContent = "Requirement submitted successfully.";
      } catch (error) {
        const projectName = projectSelect.selectedOptions[0].text;
        const skillName = skillSelect.selectedOptions[0].text;
        formMessage.textContent = `Requirement selected for ${projectName} with ${skillName}.`;
      }

      formMessage.hidden = false;
    });

    async function logout() {
      logoutButton.disabled = true;
      logoutButtonText.textContent = "Logging out...";

      try {
        const response = await fetch("/api/logout", {
          method: "POST",
          credentials: "same-origin"
        });

        let data = {};
        try { data = await response.json(); } catch { data = {}; }

        if (!response.ok) {
          throw new Error(data.detail || "Logout failed.");
        }

        window.location.replace(data.redirect_url || "/");
      } catch (error) {
        console.error("Logout failed:", error);
        window.location.replace("/");
      }
    }

    logoutButton.addEventListener("click", logout);
  </script>
</body>
</html>
