<style>
:root {
    --bg: #f8f6fc;
    --surface: #ffffff;
    --primary: #b39ddb;
    --primary-hover: #9f8bc8;
    --primary-light: #ede7f6;
    --text: #4f4a5a;
    --muted: #8f88a0;
    --line: #e9e2f3;
    --success: #5f9f7c;
    --error: #c06c84;
}

.page-title { text-align: center; font-size: 30px; color: var(--text); margin-bottom: 10px; }
.page-sub   { text-align: center; color: var(--muted); margin-bottom: 30px; }

.card {
    max-width: 750px; margin: 0 auto; padding: 35px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 24px; box-shadow: 0 10px 40px rgba(94,75,128,.08);
    position: relative;
}

.upload-box {
    border: 2px dashed #d7caec; border-radius: 20px; min-height: 220px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    cursor: pointer; background: #fcfbff; transition: .25s;
}
.upload-box:hover, .upload-box.dragover { background: var(--primary-light); border-color: var(--primary); }
.upload-box[hidden] { display: none; }
.upload-icon { font-size: 56px; margin-bottom: 8px; }
.upload-box h3 { margin: 0; color: var(--text); }
.upload-box p  { color: var(--muted); }

input[type="file"] { display: none; }

.file-list { margin-top: 14px; padding: 0; list-style: none; }
.file-list[hidden] { display: none; }
.file-list li {
    padding: 8px 12px; background: #f8f6fc; border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 6px; color: var(--text); font-size: 14px;
    display: flex; justify-content: space-between;
}

.primary {
    width: 100%; margin-top: 25px; padding: 14px; border: none;
    border-radius: 14px; background: var(--primary); color: white;
    font-size: 15px; font-weight: 600; cursor: pointer;
}
.primary:hover { background: var(--primary-hover); }
.primary:disabled { opacity: .6; cursor: not-allowed; }
.primary[hidden] { display: none; }

/* loader overlay */
.overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,.85);
    border-radius: 24px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 5;
}
.overlay[hidden] { display: none; }
.spinner {
    width: 46px; height: 46px; border: 5px solid var(--primary-light);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin .8s linear infinite;
}
.overlay p { margin-top: 14px; color: var(--text); font-weight: 600; }
@keyframes spin { to { transform: rotate(360deg); } }

/* success screen */
.success-box {
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 30px 10px; text-align: center;
}
.success-box[hidden] { display: none; }
.tick {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--primary-light);
    display: flex; justify-content: center; align-items: center;
    font-size: 44px; color: var(--success);
    animation: pop .4s ease;
}
.success-box h3 { margin: 16px 0 4px; color: var(--text); }
.success-box p  { color: var(--muted); margin: 0; }
.upload-more {
    margin-top: 22px; padding: 12px 26px; border: none;
    border-radius: 14px; background: var(--primary); color: white;
    font-size: 15px; font-weight: 600; cursor: pointer;
}
.upload-more:hover { background: var(--primary-hover); }
@keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
</style>

<h1 class="page-title">Upload Resumes</h1>
<p class="page-sub">Upload one or more PDF/DOCX resumes. The agent processes them all automatically.</p>

<form id="resumeForm" class="card">

    <!-- loader shows while processing -->
    <div id="overlay" class="overlay" hidden>
        <div class="spinner"></div>
        <p id="overlayText">Processing resumes...</p>
    </div>

    <!-- upload area -->
    <label id="uploadBox" class="upload-box" for="resumeFile">
        <div class="upload-icon">📄</div>
        <h3>Upload Resumes</h3>
        <p>Drag & Drop or Click to Browse (multiple allowed)</p>
        <input type="file" id="resumeFile" name="files" accept=".pdf,.docx" multiple required />
    </label>

    <ul id="fileList" class="file-list"></ul>

    <button id="submitBtn" class="primary" type="submit">Process Resumes</button>

    <!-- success screen (hidden until done) -->
    <div id="successBox" class="success-box" hidden>
        <div class="tick">✔</div>
        <h3>Done!</h3>
        <p>Your resumes were processed successfully.</p>
        <button type="button" id="uploadMoreBtn" class="upload-more">Upload More</button>
    </div>

</form>

<script>
const resumeForm = document.getElementById("resumeForm");

if (resumeForm) {
    const resumeFile    = document.getElementById("resumeFile");
    const uploadBox     = document.getElementById("uploadBox");
    const fileList      = document.getElementById("fileList");
    const overlay       = document.getElementById("overlay");
    const overlayText   = document.getElementById("overlayText");
    const submitBtn     = document.getElementById("submitBtn");
    const successBox    = document.getElementById("successBox");
    const uploadMoreBtn = document.getElementById("uploadMoreBtn");

    // show the list of selected files
    function renderFiles() {
        fileList.innerHTML = "";
        [...resumeFile.files].forEach(f => {
            const li = document.createElement("li");
            li.innerHTML = `<span>${f.name}</span><span>${(f.size/1024).toFixed(0)} KB</span>`;
            fileList.appendChild(li);
        });
    }

    resumeFile.addEventListener("change", renderFiles);

    // drag & drop styling
    ["dragenter", "dragover"].forEach(ev => {
        uploadBox.addEventListener(ev, e => { e.preventDefault(); uploadBox.classList.add("dragover"); });
    });
    ["dragleave", "drop"].forEach(ev => {
        uploadBox.addEventListener(ev, e => { e.preventDefault(); uploadBox.classList.remove("dragover"); });
    });

    // handle dropped files (supports multiple)
    uploadBox.addEventListener("drop", e => {
        if (e.dataTransfer.files.length) {
            resumeFile.files = e.dataTransfer.files;
            renderFiles();
        }
    });

    // submit -> upload -> show green tick
    resumeForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!resumeFile.files.length) return;

        // turn on loader
        overlay.hidden = false;
        submitBtn.disabled = true;
        overlayText.textContent = `Processing ${resumeFile.files.length} resume(s)...`;

        const data = new FormData();
        [...resumeFile.files].forEach(f => data.append("files", f));  // key must match backend "files"

        try {
            const res = await fetch("/api/process-resumes", {
                method: "POST",
                credentials: "same-origin",
                body: data
            });
            await res.json();   // just wait for it to finish, no details shown

            // ---- SUCCESS: hide upload UI, show green tick ----
            uploadBox.hidden = true;
            fileList.hidden = true;
            submitBtn.hidden = true;
            successBox.hidden = false;

        } catch (err) {
            // on error keep the form so user can retry
            alert("Error: " + err.message);
        } finally {
            overlay.hidden = true;
            submitBtn.disabled = false;
        }
    });

    // ---- Upload More: reset everything back to the upload screen ----
    uploadMoreBtn.addEventListener("click", () => {
        resumeForm.reset();          // clears the file input
        fileList.innerHTML = "";     // clear the file list
        successBox.hidden = true;    // hide success screen
        uploadBox.hidden = false;    // show upload box again
        fileList.hidden = false;
        submitBtn.hidden = false;    // show the process button again
    });
}
</script>
